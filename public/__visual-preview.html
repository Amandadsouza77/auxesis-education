<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Visual presentation preview</title><style>body{margin:0;background:#ddd;font:14px Arial}header{position:sticky;top:0;z-index:10;padding:10px;background:#fff;display:flex;gap:12px;align-items:center}iframe{border:0;background:white;display:block;margin:0 auto}button,a{padding:8px}pre{white-space:pre-wrap;margin:1rem}</style><header><strong id="name"></strong><button id="full">Full page</button><button id="screen">Screen</button><button id="prev">Previous screen</button><button id="next">Next screen</button></header><iframe id="site" title="Website preview"></iframe><pre id="metrics">Loading…</pre><script>
const params=new URLSearchParams(location.search), width=Number(params.get('width')||390), path=params.get('path')||'/',frame=document.getElementById('site');
document.getElementById('name').textContent=path+' · '+width+' px';frame.width=width;frame.height=844;frame.src=path;const gallery=params.get('gallery')==='1', scale=Number(params.get('scale')||1);if(!gallery&&scale!==1){frame.style.zoom=scale}let galleryGrid;
function lines(el){const d=el.ownerDocument,walker=d.createTreeWalker(el,4),out=[];let n;while(n=walker.nextNode()){const text=n.textContent;for(const m of text.matchAll(/\S+/g)){const r=d.createRange();r.setStart(n,m.index);r.setEnd(n,m.index+m[0].length);const b=r.getBoundingClientRect();if(!b.width||!b.height)continue;let line=out.find(x=>Math.abs(x.y-b.top)<3);if(!line){line={y:b.top,words:[]};out.push(line)}line.words.push(m[0])}}return out.sort((a,b)=>a.y-b.y).map(x=>x.words.join(' '))}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow,visible=e=>e.getBoundingClientRect().height>0&&w.getComputedStyle(e).visibility!=='hidden';return{width:w.innerWidth,height:d.documentElement.scrollHeight,overflow:d.documentElement.scrollWidth>w.innerWidth,overflowElements:[...d.querySelectorAll('main *,header *,footer *')].filter(visible).filter(e=>{const b=e.getBoundingClientRect();return b.right>w.innerWidth+1||b.left<-1}).slice(0,10).map(e=>({tag:e.tagName,class:e.className,text:e.textContent.slice(0,120)})),headings:[...d.querySelectorAll('h1,h2,h3')].map(e=>({text:e.textContent,lines:lines(e)})),navigation:[...d.querySelectorAll('.page-navigation a')].map(e=>({text:e.textContent,lines:lines(e),width:e.getBoundingClientRect().width})),buttons:[...d.querySelectorAll('.button')].map(e=>({text:e.textContent,lines:lines(e),width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height})),fields:[...d.querySelectorAll('.field')].filter(visible).map(e=>({label:e.childNodes[0]?.textContent.trim(),controlTop:e.querySelector('input,select,textarea')?.getBoundingClientRect().top,height:e.getBoundingClientRect().height})),cards:[...d.querySelectorAll('.recommendation-card')].map(e=>({top:e.getBoundingClientRect().top,height:e.getBoundingClientRect().height})),smallControls:[...d.querySelectorAll('a,button,summary,label.check,label.contact-method')].filter(visible).filter(e=>e.matches('header a,footer nav a,.programme-nav a,.button,button,summary,label.check')).map(e=>({text:e.textContent,height:e.getBoundingClientRect().height,width:e.getBoundingClientRect().width})).filter(x=>x.height<43),paragraphOrphans:[...d.querySelectorAll('main p,blockquote p')].filter(visible).map(e=>({text:e.textContent.slice(0,90),lines:lines(e)})).filter(x=>x.lines.length>1&&x.lines.at(-1).split(' ').length===1)}}
frame.addEventListener('load',async()=>{await frame.contentDocument.fonts.ready;document.getElementById('metrics').textContent=JSON.stringify(inspect(),null,2);if(params.get('full')==='1')frame.height=frame.contentDocument.documentElement.scrollHeight;if(gallery){const count=Math.ceil(frame.contentDocument.documentElement.scrollHeight/730);galleryGrid=document.createElement('div');galleryGrid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,'+(width*scale)+'px);gap:12px;justify-content:center;padding:12px';for(let i=0;i<count;i++){const cell=document.createElement('div');cell.style.cssText='width:'+(width*scale)+'px;height:'+(844*scale)+'px;overflow:hidden';const f=document.createElement('iframe');f.width=width;f.height=844;f.style.cssText='margin:0;transform-origin:top left;transform:scale('+scale+')';f.src=path;f.addEventListener('load',async()=>{await f.contentDocument.fonts.ready;f.contentWindow.scrollTo(0,i*730)});cell.append(f);galleryGrid.append(cell)}frame.after(galleryGrid);frame.style.display='none';document.getElementById('metrics').style.display='none'}});
document.getElementById('full').onclick=()=>{frame.contentWindow.scrollTo(0,0);frame.height=frame.contentDocument.documentElement.scrollHeight};document.getElementById('screen').onclick=()=>frame.height=844;document.getElementById('prev').onclick=()=>gallery?window.scrollBy(0,-800):frame.contentWindow.scrollBy(0,-730);document.getElementById('next').onclick=()=>gallery?window.scrollBy(0,800):frame.contentWindow.scrollBy(0,730);
</script>
