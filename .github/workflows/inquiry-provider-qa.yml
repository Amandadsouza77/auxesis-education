name: Diagnose configured email provider with one owner-only QA message
on:
  push:
    branches: [codex/cloudflare-backend-migration]
    paths: [.github/workflows/inquiry-provider-qa.yml, scripts/inquiry-provider-qa.mjs]
permissions:
  contents: read
jobs:
  provider-qa:
    runs-on: ubuntu-latest
    environment: auxesis-migration-preview
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/inquiry-provider-qa.mjs
