name: Check migration pilot readiness
on:
  workflow_dispatch:
  push:
    branches: [codex/cloudflare-backend-migration]
    paths: [.github/workflows/cloudflare-pilot-readiness.yml]
permissions:
  contents: read
concurrency:
  group: auxesis-migration-access
  cancel-in-progress: false
jobs:
  check-readiness:
    if: github.repository == 'Amandadsouza77/auxesis-education' && github.ref == 'refs/heads/codex/cloudflare-backend-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: auxesis-migration-preview
    steps:
      - name: Inspect preview configuration without changing Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
          PORTAL_TOKEN_KEY: ${{ secrets.PORTAL_TOKEN_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          def stop(message):
              escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Auxesis read-only readiness::" + escaped)
              raise SystemExit(message)
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if not token:
              stop("Protected preview Cloudflare credential is missing.")
          base = "https://api.cloudflare.com/client/v4/accounts/2ac862d7c1f865935d185df59e7bd719"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          auth_sql = "SELECT COUNT(*) AS count FROM google_connections WHERE email='adsouza35@gmail.com'"
          health_sql = "SELECT json_extract(data, '$.syncHealth') AS health FROM portal_records WHERE id='settings'"
          def read(path, sql=None):
              if sql is not None and (path != "/d1/database/34a9449d-85ee-4f06-a55d-3485905ca64e/query" or sql not in [auth_sql, health_sql]):
                  stop("Readiness query is outside its read-only scope.")
              headers = {"Authorization": "Bearer " + token, "User-Agent": "Auxesis-Pilot-Readiness/1.0"}
              if sql is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(base + path, headers=headers,
                  method="GET" if sql is None else "POST",
                  data=None if sql is None else json.dumps({"sql": sql}).encode())
              try:
                  with opener.open(request, timeout=30) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as error:
                  stop("Cloudflare readiness read failed: HTTP " + str(error.code))
              except (urllib.error.URLError, TimeoutError, ValueError):
                  stop("Cloudflare readiness read failed; response omitted.")
              if not data.get("success"):
                  stop("Cloudflare readiness read was rejected; response omitted.")
              return data.get("result")
          project = read("/pages/projects/auxesis-education")
          if project.get("name") != "auxesis-education" or project.get("production_branch") != "main":
              stop("Unexpected project configuration; stopped.")
          live_configs = project.get("deployment_configs") or {}
          pilot_id = "34a9449d-85ee-4f06-a55d-3485905ca64e"
          if any(pilot_id == binding.get("id") for config in live_configs.values()
                 for binding in (config.get("d1_databases") or {}).values()):
              stop("STOP: isolated pilot database is attached to the live project.")
          project = read("/pages/projects/auxesis-migration-preview")
          if (project.get("name") != "auxesis-migration-preview" or
              project.get("production_branch") != "main" or project.get("source") or
              project.get("canonical_deployment")):
              stop("Unexpected isolated pilot project; stopped.")
          configs = project.get("deployment_configs") or {}
          preview = configs.get("preview") or {}
          production = configs.get("production") or {}
          preview_ids = {v.get("id") for v in (preview.get("d1_databases") or {}).values() if isinstance(v, dict)}
          production_ids = {v.get("id") for v in (production.get("d1_databases") or {}).values() if isinstance(v, dict)}
          if production_ids or production.get("env_vars"):
              google_keys = ["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_API_KEY", "GOOGLE_APP_ID"]
              names = sorted(key for key in (production.get("env_vars") or {}) if key in
                             google_keys)
              preview_states = []
              for key in google_keys:
                  variable = (preview.get("env_vars") or {}).get(key) or {}
                  configured = bool(variable.get("value")) or variable.get("type") == "secret_text"
                  preview_states.append(key + ": " + ("configured" if configured else "missing"))
              stop("STOP: isolated pilot has production bindings or credentials." +
                   (" Google variable names configured in Production: " + ", ".join(names) if names else "") +
                   ". Preview status: " + "; ".join(preview_states))
          variables = preview.get("env_vars") or {}
          required = ["MIGRATION_PREVIEW_ONLY", "ADMIN_EMAIL", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET",
                      "GOOGLE_API_KEY", "GOOGLE_APP_ID", "PORTAL_TOKEN_KEY", "PILOT_STUDENT_ID",
                      "PILOT_STUDENT_NAME", "GOOGLE_SPREADSHEET_ID", "GOOGLE_CALENDAR_ID", "PILOT_SERIES_IDS"]
          lines = ["Control-plane reads only: GET plus fixed D1 SELECTs. No settings, deployments or business records changed.",
                   "Pilot database bound to production: no",
                   "Preview PORTAL_DB binding: " + ("present" if (preview.get("d1_databases") or {}).get("PORTAL_DB", {}).get("id") == pilot_id else "missing")]
          for key in required:
              variable = variables.get(key) or {}
              configured = bool(variable.get("value")) or variable.get("type") == "secret_text"
              protected = bool(os.environ.get(key))
              lines.append(key + ": preview " + ("configured" if configured else "missing") +
                           "; protected workflow secret " + ("available" if protected else "not available"))
          lines.append("Live project: isolated pilot database is absent from all bindings.")
          deployments = read("/pages/projects/auxesis-migration-preview/deployments?per_page=10")
          if isinstance(deployments, list):
              branch = "codex/cloudflare-backend-migration"
              matches = [d for d in deployments if ((d.get("deployment_trigger") or {}).get("metadata") or {}).get("branch") == branch]
              if matches:
                  latest = matches[0]
                  if latest.get("environment") != "preview":
                      stop("STOP: migration deployment is not a preview.")
                  lines.append("Migration preview URL: " + str(latest.get("url", "")))
                  lines.append("Deployed source commit: " + str((latest.get("deployment_trigger", {}).get("metadata") or {}).get("commit_hash", "unknown")))
                  lines.append("Migration preview stage: " + str((latest.get("latest_stage") or {}).get("status", "unknown")))
                  deployed_vars = latest.get("env_vars") or {}
                  for key in ["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_API_KEY", "GOOGLE_APP_ID"]:
                      variable = deployed_vars.get(key) or {}
                      configured = bool(variable.get("value")) or variable.get("type") == "secret_text"
                      lines.append(key + ": deployed " + ("configured" if configured else "not reported"))
              else:
                  lines.append("Migration preview: absent from latest 10 deployments")
          auth_rows = read("/d1/database/" + pilot_id + "/query", auth_sql)
          connections = sum(row["count"] for item in auth_rows for row in item.get("results", []))
          lines.append("Administrator Google connection: " + ("present; usability unverified" if connections else "absent; owner authentication required"))
          key = (variables.get("PORTAL_TOKEN_KEY") or {}).get("value")
          lines.append("Existing token-encryption key returned by API: " + ("present; usability unverified" if key else "opaque; do not request or replace it"))
          for item in read("/d1/database/" + pilot_id + "/query", health_sql):
              for row in item.get("results", []):
                  health = json.loads(row.get("health") or "{}")
                  summary = health.get("summary") or {}
                  safe = {k: health.get(k) for k in ["state", "lastReadAt", "lastSuccessfulAt"]}
                  safe.update({k: summary.get(k) for k in ["eventCount", "changedRecords", "canApply", "issues"]})
                  lines.append("Recorded pilot preview: " + json.dumps(safe))
                  diagnostics = summary.get("diagnostics")
                  if diagnostics is not None:
                      # GitHub truncates a large annotation. Keep facts lossless
                      # and below the per-step ten-annotation limit.
                      compact = json.dumps(diagnostics, separators=(",", ":"))
                      chunks = [compact[i:i+2400] for i in range(0, len(compact), 2400)]
                      if len(chunks) > 8:
                          stop("Pilot diagnostic facts exceed the bounded annotation read; no records changed.")
                      for index, chunk in enumerate(chunks, 1):
                          escaped_chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print("::notice title=Auxesis pilot facts " + str(index) + "/" + str(len(chunks)) + "::" + escaped_chunk)
          lines.append("Google-authenticated live sync and replay remain unverified; inventory is not an end-to-end test.")
          print("\n".join(lines))
          # Keep non-secret presence checks readable through the GitHub API
          # when the runner's external log-download host is unavailable.
          # One annotation avoids the runner's per-step annotation limit.
          escaped = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=Auxesis read-only readiness::" + escaped)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("## Read-only pilot readiness inventory\n\n" + "\n".join("- " + line for line in lines) + "\n")
          PY
