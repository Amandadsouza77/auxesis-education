name: Observe one owner inquiry attempt without logging personal data
on:
  push:
    branches: [codex/cloudflare-backend-migration]
    paths: [.github/workflows/inquiry-trace.yml, scripts/inquiry-trace.mjs]
permissions:
  contents: read
  statuses: write
jobs:
  inquiry-trace:
    runs-on: ubuntu-latest
    environment: auxesis-migration-preview
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2ac862d7c1f865935d185df59e7bd719
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/inquiry-trace.mjs
