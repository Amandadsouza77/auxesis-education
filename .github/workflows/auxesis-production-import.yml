name: Import preserved records into isolated Auxesis production database
on:
  push:
    branches: [codex/cloudflare-backend-migration]
    paths:
      - .github/workflows/auxesis-production-import.yml
      - scripts/production-import.mjs
      - scripts/production-sync-schema.sql
      - scripts/production-prepare.mjs
permissions:
  contents: read
concurrency:
  group: auxesis-production-preparation
  cancel-in-progress: false
jobs:
  import-preserved-records:
    if: github.repository == 'Amandadsouza77/auxesis-education' && github.ref == 'refs/heads/codex/cloudflare-backend-migration' && vars.PRODUCTION_RECOVERY_DRIVE_FILE_ID != '' && vars.PRODUCTION_RECOVERY_SHA256 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: auxesis-migration-preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate migration safeguards
        run: node tests/production-import.test.mjs
      - name: Import preserved durable records into separate unpublished database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PRODUCTION_RECOVERY_DRIVE_FILE_ID: ${{ vars.PRODUCTION_RECOVERY_DRIVE_FILE_ID }}
          PRODUCTION_RECOVERY_SHA256: ${{ vars.PRODUCTION_RECOVERY_SHA256 }}
        run: node scripts/production-import.mjs
