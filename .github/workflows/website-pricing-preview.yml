name: Review public website pricing update
on:
  push:
    branches: [codex/website-pricing-discounts-2026-10-09]
permissions:
  contents: read
concurrency:
  group: auxesis-website-pricing-preview
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check existing public site
        run: |
          npm run build
          python3 scripts/check_site.py
          node --test tests/public-forms.test.mjs tests/api.test.mjs tests/public-proxy.test.mjs
      - name: Install browser QA tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile pricing and enquiry access
        run: |
          mkdir -p qa
          python3 -m http.server 8080 --directory dist > /tmp/auxesis-preview-server.log 2>&1 &
          node tests/pricing-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auxesis-pricing-review-screenshots
          path: qa/*.png
