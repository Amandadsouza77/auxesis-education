name: PR 23 protected native verification (test only)
on:
  push:
    branches: [codex/cloudflare-backend-migration]
    paths: [.github/workflows/pr23-native-isolated.yml]
permissions:
  contents: read
concurrency:
  group: auxesis-pr23-native-tests
  cancel-in-progress: false
jobs:
  native-isolated:
    runs-on: ubuntu-latest
    environment: auxesis-migration-preview
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify test-only trusted branch change
        run: |
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/pr23-native-isolated.yml'
          test "$(git rev-parse HEAD:scripts/prelaunch-runtime-recover.mjs)" = "e6da12fec320426c7b19adeeb53e07fabada45e2"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover private checksum-pinned package read only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/prelaunch-runtime-recover.mjs
      - name: Inspect native binding interface names only
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,readdirSync,statSync} from 'node:fs';
          const root='work/staging-deployment/runtime';
          const files=d=>readdirSync(d).flatMap(n=>{const p=d+'/'+n;return statSync(p).isDirectory()?files(p):[p]});
          const keys=new Set();
          for(const file of [root+'/staging-entry.js',...files(root+'/cloudflare')].filter(f=>f.endsWith('.js'))){for(const m of readFileSync(file,'utf8').matchAll(/\.([A-Z][A-Z0-9_]{2,})\b/g))keys.add(m[1]);}
          console.log('Native binding interface names (no values): '+JSON.stringify([...keys].sort()));
          for(const file of files(root+'/cloudflare').filter(f=>f.endsWith('.js')&&/review|form/.test(f))){const source=readFileSync(file,'utf8');console.log(JSON.stringify({module:file.split('/').at(-1),exports:[...source.matchAll(/export\s+(?:async\s+)?(?:function|const|class)\s+(\w+)/g)].map(m=>m[1])}));}
          JS
      - name: Verify existing native tests in isolated fixtures
        working-directory: work/staging-deployment/runtime
        run: node tests/website-reviews.test.mjs
      - name: Checkout exact PR candidate without credentials
        uses: actions/checkout@v4
        with:
          ref: ded767822f1a098368cabccc9a8776504812e3c1
          path: candidate
          persist-credentials: false
      - name: Install test tools without provider credentials
        working-directory: candidate
        run: npm install --no-save --ignore-scripts esbuild@0.25 miniflare@4.20260730.0
      - name: Assemble actual native candidate without release scripts
        working-directory: candidate
        env:
          QA_NATIVE_ROOT: ${{ github.workspace }}/work/staging-deployment/runtime
        run: node scripts/assemble-native-review-qa.mjs
      - name: Test actual worker using ephemeral local D1
        working-directory: candidate
        env:
          QA_NATIVE_ROOT: ${{ github.workspace }}/work/staging-deployment/runtime
        run: node tests/native-review-isolated.mjs
      - name: Test enquiry with mocked providers in actual workerd
        working-directory: candidate
        run: node tests/inquiry-runtime.mjs
      - name: Publish bounded synthetic test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-native-test-evidence
          path: candidate/work/native-review-qa/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove private recovery files
        if: always()
        run: rm -rf work/staging-deployment candidate/work/native-review-qa
