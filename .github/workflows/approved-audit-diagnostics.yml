name: Read-only PR 23 release rehearsal
on:
  push:
    branches: [codex/cloudflare-backend-migration]
    paths: [.github/workflows/approved-audit-diagnostics.yml]
permissions:
  contents: read
concurrency:
  group: auxesis-production-preparation
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: auxesis-migration-preview
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify trusted workflow-only change
        run: |
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/approved-audit-diagnostics.yml'
          test "$(git rev-parse HEAD:scripts/prelaunch-runtime-recover.mjs)" = 'e6da12fec320426c7b19adeeb53e07fabada45e2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover the private checksum-pinned runtime read only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/prelaunch-runtime-recover.mjs
      - uses: actions/checkout@v4
        with:
          ref: c60ef472f56cd309af48cd7ff717eb19b8e1c53a
          path: candidate
          persist-credentials: false
      - name: Install isolated candidate test tools
        working-directory: candidate
        run: npm install --no-save --ignore-scripts esbuild@0.25 miniflare@4.20260730.0 playwright@1.56.0
      - name: Preserve separate native fixtures and release preparation source
        run: |
          cp -a work/staging-deployment/runtime /tmp/auxesis-current-release-qa
          mkdir -p candidate/work/staging-deployment
          cp -a work/staging-deployment/runtime candidate/work/staging-deployment/runtime
      - name: Test current native worker with isolated storage and mocked providers
        working-directory: candidate
        env:
          QA_NATIVE_ROOT: /tmp/auxesis-current-release-qa
        run: |
          (cd work/staging-deployment/runtime && node tests/website-reviews.test.mjs)
          node scripts/assemble-native-review-qa.mjs
          node tests/native-review-isolated.mjs
          node tests/native-enquiry-isolated.mjs
          node tests/inquiry-runtime.mjs
      - name: Rehearse the production guard without deployment
        working-directory: candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx esbuild work/staging-deployment/runtime/staging-entry.js --bundle --format=esm --outfile=work/staging-deployment/runtime/dist/_worker.js
          node scripts/approved-audit-release.mjs prepare
          npx esbuild work/staging-deployment/runtime/inquiry-entry.js --bundle --format=esm --outfile=work/staging-deployment/runtime/dist/_worker.js
          node scripts/approved-audit-release.mjs check
      - name: Check all public pages and enquiry UI without sending email
        working-directory: candidate
        env:
          QA_ORIGIN: http://127.0.0.1:8765
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory work/staging-deployment/runtime/dist >/tmp/auxesis-release-browser.log 2>&1 &
          node scripts/approved-audit-browser-qa.mjs
      - name: Recheck unchanged production and record bounded dry-run evidence
        working-directory: candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/approved-audit-release.mjs check
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const state=JSON.parse(readFileSync('work/approved-audit-release.json'));
          const evidence={candidate:'c60ef472f56cd309af48cd7ff717eb19b8e1c53a',rollbackDeployment:state.deployment,productionUnchanged:true,configurationUnchanged:true,publicAssets:Object.keys(state.publicFiles).length,workerHash:createHash('sha256').update(readFileSync('work/staging-deployment/runtime/dist/_worker.js')).digest('hex'),deployment:false,realEmailsSent:0};
          writeFileSync('work/native-review-qa/release-dryrun.json',JSON.stringify(evidence,null,2));console.log(JSON.stringify(evidence));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr23-current-release-rehearsal
          path: candidate/work/native-review-qa/*.json
          retention-days: 14
      - name: Remove all private recovery and fixture files
        if: always()
        run: rm -rf work/staging-deployment candidate/work/staging-deployment candidate/work/native-review-qa /tmp/auxesis-current-release-qa
