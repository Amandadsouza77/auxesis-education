name: Cloudflare migration access check

on:
  push:
    branches: [codex/cloudflare-backend-migration]
    paths: [.github/workflows/cloudflare-migration-access.yml]

permissions:
  contents: read

concurrency:
  group: auxesis-migration-access
  cancel-in-progress: false

jobs:
  verify-access:
    if: github.repository == 'Amandadsouza77/auxesis-education' && github.ref == 'refs/heads/codex/cloudflare-backend-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: auxesis-migration-preview
    steps:
      - name: Check Pages and D1 access without changing Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if not token:
              raise SystemExit("CLOUDFLARE_API_TOKEN is missing from auxesis-migration-preview.")
          account = "2ac862d7c1f865935d185df59e7bd719"
          base = "https://api.cloudflare.com/client/v4/accounts/" + account
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def read(path):
              req = urllib.request.Request(base + path, headers={"Authorization": "Bearer " + token, "Accept": "application/json"}, method="GET")
              try:
                  with opener.open(req, timeout=30) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit("Cloudflare read failed with HTTP " + str(error.code) + ". No response body or credentials were logged.")
              except (urllib.error.URLError, TimeoutError, ValueError):
                  raise SystemExit("Cloudflare read failed. No credentials were logged.")
              if not data.get("success"):
                  raise SystemExit("Cloudflare rejected the read. No response body or credentials were logged.")
              return data.get("result")
          project = read("/pages/projects/auxesis-education")
          databases = read("/d1/database?per_page=100")
          if not isinstance(project, dict) or project.get("name") != "auxesis-education":
              raise SystemExit("Unexpected Pages project; stopped.")
          if not isinstance(databases, list):
              raise SystemExit("Unexpected D1 inventory; stopped.")
          preview = (project.get("deployment_configs") or {}).get("preview") or {}
          production = (project.get("deployment_configs") or {}).get("production") or {}
          preview_d1 = preview.get("d1_databases") or {}
          production_d1 = production.get("d1_databases") or {}
          summary = [
              "Cloudflare Pages access: verified",
              "Cloudflare D1 access: verified",
              "Requests: GET only; no settings, deployments or records changed.",
              "Production branch: " + str(project.get("production_branch", "unknown")),
              "Preview PORTAL_DB binding: " + ("present" if "PORTAL_DB" in preview_d1 else "missing"),
              "Preview variable names: " + ", ".join(sorted(preview.get("env_vars") or {})),
              "D1 database count: " + str(len(databases)),
          ]
          for db in databases:
              name = str(db.get("name", ""))
              if "auxesis" in name.lower() and ("preview" in name.lower() or "pilot" in name.lower()):
                  summary.append("Candidate preview database: " + name + " (" + str(db.get("uuid", "")) + ")")
          production_ids = {item.get("id") for item in production_d1.values() if isinstance(item, dict)}
          preview_ids = {item.get("id") for item in preview_d1.values() if isinstance(item, dict)}
          if production_ids & preview_ids:
              summary.append("STOP: a D1 database is shared by preview and production.")
          print("\n".join(summary))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Cloudflare migration access\n\n" + "\n".join("- " + line for line in summary) + "\n")
          PY
