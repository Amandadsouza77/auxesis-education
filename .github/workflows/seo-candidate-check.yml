name: SEO candidate browser checks (no deployment)
on:
  push:
    branches: [codex/ontario-science-pages-review]
    paths: [.github/workflows/seo-candidate-check.yml, scripts/seo-metadata.mjs, scripts/approved-public-copy.mjs, scripts/international-pages.mjs, scripts/ontario-pages.mjs, scripts/approved-audit-release.mjs, content/ontario-previous-baseline-hashes.json, content/ontario-pages.json, tests/ontario-pages.test.mjs, content/international-pages.json, content/international-previous-baseline-hashes.json, tests/seo-*.test.mjs]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/seo-metadata.test.mjs tests/seo-release-safety.test.mjs tests/seo-international-wrapper.test.mjs tests/ontario-pages.test.mjs
      - name: Verify recorded Phase 1 immutable asset baseline
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifest=JSON.parse(readFileSync('content/international-previous-baseline-hashes.json'));
          const origin='https://efe1f29d.auxesis-education.pages.dev';
          let mismatches=[];
          for(const [path,digest] of Object.entries(manifest)){
           let url=origin+'/'+path.replace(/index\\.html$/,''),r;
           for(let i=0;i<4;i++){
            r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(30000)});
            if(![301,302,303,307,308].includes(r.status))break;
            const next=new URL(r.headers.get('location'),url);
            if(next.origin!==origin)throw Error('Unexpected redirect '+path);
            url=next.href;
           }
           if(!r.ok&&!(path==='404.html'&&r.status===404))throw Error('Asset HTTP failure '+path+': '+r.status);
           const actual=createHash('sha256').update(Buffer.from(await r.arrayBuffer())).digest('hex');if(actual!==digest)mismatches.push({path,actual,expected:digest});
          }
          if(mismatches.length){console.log(JSON.stringify({mismatches}));throw Error('Baseline mismatches');}
          console.log('PASS: '+Object.keys(manifest).length+' immutable Phase 1 assets match.');
          JS
      - name: Capture and compare verified Phase 2 static baseline
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const old=JSON.parse(readFileSync('content/international-previous-baseline-hashes.json','utf8'));
          const newPages=JSON.parse(readFileSync('content/international-pages.json','utf8')).map(p=>p.slug+'/index.html');
          const allowed=new Set(['about-amanda/index.html','subjects-programmes/index.html','sitemap.xml',...newPages]);
          const paths=[...Object.keys(old),...newPages].sort(), manifest={};
          for(const path of paths){
           let url='https://332ab895.auxesis-education.pages.dev/'+path.replace(/index\\.html$/,''),r;
           for(let i=0;i<4;i++){r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(30000)});
            if(![301,302,303,307,308].includes(r.status))break;
            const next=new URL(r.headers.get('location'),url);
            if(next.origin!=='https://332ab895.auxesis-education.pages.dev')throw Error('Unexpected redirect '+path);url=next.href;
           }
           if(!r.ok&&!(path==='404.html'&&r.status===404))throw Error('Asset unavailable: '+path+' HTTP '+r.status);
           manifest[path]=createHash('sha256').update(Buffer.from(await r.arrayBuffer())).digest('hex');
           if(old[path]&&!allowed.has(path)&&old[path]!==manifest[path])throw Error('Unexpected Phase 2 asset change: '+path);
          }
          const recorded=JSON.parse(readFileSync('content/ontario-previous-baseline-hashes.json','utf8'));
          if(JSON.stringify(recorded)!==JSON.stringify(manifest))throw Error('Recorded Phase 2 baseline differs');
          console.log('PHASE2_BASELINE_MANIFEST '+JSON.stringify(manifest));
          console.log('PASS: 55 immutable Phase 2 assets compared; only approved page, biography and sitemap changes allowed.');
          JS
      - name: Prepare synthetic static candidate
        run: |
          mkdir -p /tmp/auxesis-seo-candidate
          cp -R public/. /tmp/auxesis-seo-candidate/
          printf '%s' '<urlset><url><loc>https://auxedu.com/</loc></url></urlset>' > /tmp/auxesis-seo-candidate/sitemap.xml
          node scripts/approved-public-copy.mjs /tmp/auxesis-seo-candidate
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/auxesis-seo-candidate >/tmp/auxesis-seo-http.log 2>&1 &
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0 esbuild@0.25
          node --test tests/seo-rollback.test.mjs
          npx playwright install --with-deps chromium
      - name: Check candidate pages at mobile and desktop widths
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const paths=['/','/about-amanda/','/about-auxesis/','/enquire/','/faq/','/how-tutoring-works/','/privacy-consent/','/recommendations/','/subjects-programmes/','/tutoring-policies/','/ib-biology-tutoring/','/ib-chemistry-tutoring/','/gcse-igcse-science-tutoring/','/a-level-biology-tutoring/','/ontario-grade-9-10-science-tutoring/','/ontario-grade-11-12-biology-chemistry-tutoring/'];
          try {
           for(const width of [320,390,768,1440]){
            const page=await browser.newPage({viewport:{width,height:900}});
            await page.route('**/api/**',r=>r.abort());
            await page.route('**/cdn-cgi/**',r=>r.abort());
            for(const path of paths){
             const response=await page.goto('http://127.0.0.1:8765'+path,{waitUntil:'domcontentloaded'});
             assert.equal(response.status(),200,path);
             assert.equal(await page.locator('h1').count(),1,path);
             assert.equal(await page.locator('link[rel=canonical]').getAttribute('href'),'https://auxedu.com'+path,path);
             assert.ok(await page.title(),path);
             if(width===1440){
              const links=await page.locator('a[href]').evaluateAll(as=>as.map(a=>a.getAttribute('href')).filter(h=>h&&h.startsWith('/')&&!h.startsWith('//')));
              for(const href of new Set(links)){
               const dest=new URL(href,'http://127.0.0.1:8765'+path);
               if(dest.pathname.startsWith('/api/')||dest.pathname.startsWith('/portal/'))continue;
               const result=await page.request.get(dest.href);
               assert.ok(result.status()<400,JSON.stringify({source:path,href,status:result.status()}));
               if(dest.hash&&result.headers()['content-type']?.includes('text/html')){
                const targetPage=await browser.newPage();
                await targetPage.goto(dest.origin+dest.pathname,{waitUntil:'domcontentloaded'});
                const found=await targetPage.evaluate(id=>!!document.getElementById(id)||!!document.getElementsByName(id).length,decodeURIComponent(dest.hash.slice(1)));
                await targetPage.close();
                assert.ok(found,JSON.stringify({source:path,href,problem:'missing fragment'}));
               }
              }
             }
             const sizes=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
             assert.ok(sizes.scroll<=sizes.client+1,JSON.stringify({path,width,...sizes}));
            }
            for(const [id,href] of [['ib','/ib-biology-tutoring/'],['ib','/ib-chemistry-tutoring/'],['alevel','/a-level-biology-tutoring/'],['gcse','/gcse-igcse-science-tutoring/']]){
             await page.goto('http://127.0.0.1:8765/subjects-programmes/',{waitUntil:'domcontentloaded'});
             assert.equal(await page.locator('.programme-nav a').count(),5);
             await page.locator('#'+id+'>summary').click();
             const link=page.locator('#'+id+' a[href="'+href+'"]');
             assert.equal(await link.count(),1);
             assert.equal(await link.isVisible(),true);
             await link.click();
             assert.equal(new URL(page.url()).pathname,href);
            }
            for(const [path,count] of [['/ontario-grade-9-10-science-tutoring/',2],['/ontario-grade-11-12-biology-chemistry-tutoring/',6]]){
             await page.goto('http://127.0.0.1:8765'+path,{waitUntil:'domcontentloaded'});
             const sections=page.locator('details.ontario-course');
             assert.equal(await sections.count(),count);
             for(let i=0;i<count;i++){
              const d=sections.nth(i), summary=d.locator('summary');
              assert.equal(await d.getAttribute('open'),null);
              await summary.focus(); await page.keyboard.press('Enter');
              assert.notEqual(await d.getAttribute('open'),null);
              assert.equal(await d.locator('.ontario-course-body').isVisible(),true);
              await page.keyboard.press('Enter'); assert.equal(await d.getAttribute('open'),null);
             }
             const heads=await page.locator('main h1, main h2, main h3, main h4, main h5').evaluateAll(es=>es.map(e=>Number(e.tagName.slice(1))));
             assert.equal(heads[0],1);
             for(let i=1;i<heads.length;i++)assert.ok(heads[i]<=heads[i-1]+1,JSON.stringify({path,previous:heads[i-1],current:heads[i]}));
             const sitemap=await (await page.request.get('http://127.0.0.1:8765/sitemap.xml')).text();
             assert.ok(sitemap.includes('https://auxedu.com'+path),path);
            }
            await page.goto('http://127.0.0.1:8765/enquire/',{waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('#enquiry-form').count(),1);
            await page.close();
           }
          } finally { await browser.close(); }
          console.log('Synthetic candidate: 10 routes at four viewport widths passed; no enquiry submitted.');
          JS

      - name: Check keyboard access and intercepted enquiry states
        env:
          QA_ORIGIN: http://127.0.0.1:8765
        run: |
          npx esbuild lib/time-zones.js --bundle --format=iife --global-name=AuxesisTimeZones --outfile=/tmp/auxesis-seo-candidate/time-zones.js
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          let s=readFileSync('scripts/approved-audit-browser-qa.mjs','utf8');
          const start=s.indexOf(" await page.goto(origin+'/recommendations/'"),end=s.indexOf(" await page.route('**/turnstile/",start);
          if(start<0||end<0)throw Error('Could not isolate synthetic candidate tests');
          s=(s.slice(0,start)+s.slice(end)).replace('Keyboard menu/accordions, recommendations,','Keyboard menu/accordions,');
          writeFileSync('scripts/synthetic-phase2-qa.mjs',s);
          JS
          node scripts/synthetic-phase2-qa.mjs
