name: Prepare private staging runtime artifact slot
on:
  push:
    branches: [codex/cloudflare-backend-migration]
    paths:
      - scripts/staging-artifact-slot.mjs
      - .github/workflows/auxesis-staging-artifact.yml
permissions:
  contents: read
concurrency:
  group: auxesis-production-preparation
  cancel-in-progress: false
jobs:
  private-slot:
    if: github.repository == 'Amandadsouza77/auxesis-education' && github.ref == 'refs/heads/codex/cloudflare-backend-migration'
    runs-on: ubuntu-latest
    environment: auxesis-migration-preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare private owner-only deployment slot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/staging-artifact-slot.mjs
