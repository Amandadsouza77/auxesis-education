name: Reconnect owner access for inquiry package only
on:
  push:
    branches: [codex/cloudflare-backend-migration]
    paths: [.github/workflows/inquiry-consent-refresh.yml, scripts/inquiry-consent-*.mjs, scripts/inquiry-consent-worker.js, scripts/inquiry-consent-google.js]
permissions:
  contents: read
concurrency:
  group: auxesis-production-preparation
  cancel-in-progress: false
jobs:
  consent-preview:
    runs-on: ubuntu-latest
    environment: auxesis-migration-preview
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2ac862d7c1f865935d185df59e7bd719
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test owner identity, state binding and package-only scope
        run: node --test tests/inquiry-consent.test.mjs
      - name: Verify isolated preview and record unchanged production
        run: node scripts/inquiry-consent-check.mjs prepare
      - name: Bundle existing consent flow limited to website package access
        run: npx --yes esbuild@0.25 scripts/inquiry-consent-worker.js --bundle --format=esm --outfile=work/inquiry-consent/site/_worker.js
      - name: Publish owner consent page to isolated preview only
        run: npx --yes wrangler@4 pages deploy work/inquiry-consent/site --project-name=auxesis-production-staging --branch=migration-auth --commit-hash="$GITHUB_SHA" --commit-dirty=false
      - name: Verify owner sign-in page and untouched production
        run: node scripts/inquiry-consent-check.mjs verify
